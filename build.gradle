plugins {
  id 'java'
  id 'org.openjfx.javafxplugin' version '0.1.0'
  id 'com.gradleup.shadow' version '9.3.0'
}

group = 'archipelagoon'
version = '2.1.0'

repositories {
  mavenLocal()
  maven { url = 'https://jitpack.io' }
  maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  mavenCentral()
}

configurations {
  bundled
  implementation.extendsFrom(bundled)
}

dependencies {
  // SC supplies the engine and its dependencies, including Log4j and Gson.
  implementation('legend:lod:snapshot') {
    changing = true
  }

  implementation files("mods/lloyd-mod-1.0-SNAPSHOT.jar")

  bundled('io.github.archipelagomw:Java-Client:0.2.2') {
    // These are already supplied by SC; retain the client's networking libraries.
    exclude group: 'com.google.code.gson', module: 'gson'
    exclude group: 'org.slf4j', module: 'slf4j-api'
  }
}

java {
  sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

javafx {
  version = "21.0.1"
  modules = ['javafx.controls', 'javafx.fxml']
}


tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

configurations.configureEach {
  resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
}

tasks.named('shadowJar') {
  configurations = [project.configurations.bundled]
  mergeServiceFiles()

  // Dependency signatures are invalid once their contents are repackaged.
  exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
